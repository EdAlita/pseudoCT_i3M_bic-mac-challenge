# Fase A5 (Utrecht): fase solo-PET. Parte del MEJOR checkpoint de v18 en cada fold
# (--warm_start_expr Multimodal_pCT_v18_stageA_torso --warm_start_dir .../experiments/checkpoints).
# Cambios frente a v18: MRI siempre en cero, topograma anulado la mitad de las veces,
# validación en la condición de Utrecht (sin MRI ni topograma), 60 épocas, LR menor.
MODEL:
  MODEL_NAME: "MultimodalPCTUNet"
  LOSS_FUNC: "multimodal_pct"
  NUM_FILTERS: 24
  NUM_CHANNELS: 1
  TOPO_CHANNELS: 1
  COORD_DIM: 3
  KERNEL_D: 3
  KERNEL_H: 3
  KERNEL_W: 3
  STRIDE_CONV: 1
  STRIDE_POOL: 2
  NUM_GROUPS: 8
  L1_WEIGHT: 1.0
  PROJ_WEIGHT: 0.1
  GRAD_WEIGHT: 0.3
  SSIM_WEIGHT: 0.2
  SSIM_WINDOW_SIZE: 11
  INTERPOLATION_MODE: "trilinear"

TRAIN:
  BATCH_SIZE: 4
  LOG_INTERVAL: 50
  RESUME: False          # Se sobrescribe vía --warm_start_expr en run_trainning.py
  FINE_TUNE: True        # Solo carga pesos del modelo, no optimizer/scheduler/época
  NUM_EPOCHS: 60         # Dos ciclos completos del coseno (20 + 40); ~3 h por fold
  CHECKPOINT_PERIOD: 10

  AMP: True
  PATCH_TRAINING: True
  PATCH_SIZE: [64, 128, 128]
  PATCH_STRIDE: [20, 40, 40]   # Igual que Docker (solo se usa en inferencia con GridSampler)
  BATCHES_PER_EPOCH: 150       # Docker: 500
  VAL_PATCHES: 750
  VAL_EVERY_N_EPOCHS: 2
  GRAD_SSIM_WARMUP_EPOCHS: 5   # v18 ya entrenó con grad/SSIM completos

DATA:
  APPLY_AUGMENTATION: True
  SIZES: [346, 391, 391]
  TARGET_SIZE: [346, 391, 391]
  VOXEL_SIZES: [2.0644, 2.0644, 2.0644]
  RESIZE_MODE: "trilinear"

  # Solo PET: el MRI siempre en cero, en train y en val.
  MRI_DROPOUT_PROB: 1.0
  MRI_DROPOUT_PROB_VAL: 1.0

  # Utrecht no tiene scout. En train se anula la mitad de las veces (por si UMC
  # llega a enviar los scouts); el mejor checkpoint se elige SIN topograma.
  TOPO_DROPOUT_PROB: 0.5
  TOPO_DROPOUT_PROB_VAL: 1.0
  TOPO_SHAPE: [512, 531]

  # Coordenadas relativas al cuerpo (bbox desde NAC-PET): requiere utils/add_body_bbox.py
  COORDS_MODE: "body"

DATA_LOADER:
  NUM_WORKERS: 8         # v18 fold 0 murió por "Cannot allocate memory" leyendo el HDF5 con 12
  PIN_MEMORY: True

OPTIMIZER:
  OPTIMIZING_METHOD: "adamw"
  BASE_LR: 3e-5          # Menor que v18 (5e-5): parte de un modelo ya ajustado sin MRI
  WEIGHT_DECAY: 5e-5
  LR_SCHEDULER: "cosineWarmRestarts"
  ETA_MIN: 1e-6          # Docker: 5e-6
  T_ZERO: 20             # 20 + 40 = 60 épocas: termina al final de un ciclo
  T_MULT: 2

NUM_GPUS: 1
LOG_DIR: "/mnt/d/Data/007_pseudoCT/training/experiments"
EXPR_NUM: "Multimodal_pCT_v19_pet_only_torso"
RNG_SEED: 42
