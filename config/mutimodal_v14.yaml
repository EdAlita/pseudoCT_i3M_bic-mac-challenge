MODEL:
  MODEL_NAME: "MultimodalPCTUNet"
  LOSS_FUNC: "multimodal_pct"
  NUM_FILTERS: 24
  NUM_CHANNELS: 1
  TOPO_CHANNELS: 1
  COORD_DIM: 3
  KERNEL_D: 3
  KERNEL_H: 3
  KERNEL_W: 3
  STRIDE_CONV: 1
  STRIDE_POOL: 2
  NUM_GROUPS: 8
  L1_WEIGHT: 1.0
  PROJ_WEIGHT: 0.1
  GRAD_WEIGHT: 0.3
  SSIM_WEIGHT: 0.2
  SSIM_WINDOW_SIZE: 11
  MAGNITUDE_WEIGHT_K: 3.0
  INTERPOLATION_MODE: "trilinear"

TRAIN:
  BATCH_SIZE: 4
  LOG_INTERVAL: 50
  RESUME: False
  NUM_EPOCHS: 1000
  CHECKPOINT_PERIOD: 50
  
  AMP: True
  PATCH_TRAINING: True
  PATCH_SIZE: [64, 128, 128] #[80, 160, 160] #[64, 128, 128]
  PATCH_STRIDE: [48, 96, 96] #[60, 120, 120] #[48, 96, 96]
  BATCHES_PER_EPOCH: 150
  VAL_PATCHES: 750
  VAL_EVERY_N_EPOCHS: 2
  GRAD_SSIM_WARMUP_EPOCHS: 30

DATA:
  APPLY_AUGMENTATION: True
  SIZES: [346, 391, 391]    
  TARGET_SIZE: [346, 391, 391]
  VOXEL_SIZES: [2.0644, 2.0644, 2.0644]
  RESIZE_MODE: "trilinear"

DATA_LOADER:
  NUM_WORKERS: 12
  PIN_MEMORY: True

OPTIMIZER:
  OPTIMIZING_METHOD: "sgd"       # antes: "adamw"
  BASE_LR: 0.01                  # <- mucho más alto que con AdamW, típico de SGD+momentum
  WEIGHT_DECAY: 5e-5
  MOMENTUM: 0.99
  NESTEROV: True
  LR_SCHEDULER: "polynomialDecay"
  POLY_POWER: 0.9
  ETA_MIN: 1e-6

NUM_GPUS: 1
LOG_DIR: "/mnt/d/Data/007_pseudoCT/training/experiments"
EXPR_NUM: "Multimodal_pCT_v16_torso"
RNG_SEED: 42